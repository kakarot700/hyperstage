name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          CI: "true"
      - run: pnpm build
      - run: node benchmarks/run-benchmark.mjs

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: node verification/verify-studio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-verification
          path: |
            verification/*.png
            verification/verification-log.txt
            benchmarks/results.json
            benchmarks/BENCHMARK.md
